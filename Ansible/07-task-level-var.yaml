---
- name: demo on task level variable
  hosts: local
  connection: local
  vars:
    property: "100 accers"
  tasks:
  - name: print the variable
    debug:
      msg: "Vijay has {{ property }} from his father"
  - name: task level var print
    vars:
      property: "10 acers"
    debug:
      msg: "swapna has {{ property }} from her husband"