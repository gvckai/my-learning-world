---
- name: demo on task level variable
  hosts: local
  connection: local
  vars:
    property: "100 accers"
  tasks:
  - name: print the variable
    debug:
      msg: "Vijay has {{ property }} from his father"
  - name: task level var print
    vars:
      property: "10 acers"
    debug:
      msg: "swapna has {{ property }} from her husband"
  - name: taske level-2
    vars:
      property: "5 acers"
    debug:
      msg: "abhiram has {{ property }} from mother"

  - name: task level vars
    vars:
      property: "5 acers"
    debug:
      msg: "honey has get {{ property }} from her father"